name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. ...
    validations:
      required: true
  - type: input
    id: file
    attributes:
      label: Game path of the file
      description: Name the path instead of attaching the file. Game files must not be uploaded.
      placeholder: vfx/monster/m0016/eff/m0016sp01c0f.avfx
  - type: input
    id: version
    attributes:
      label: FViewer version
      placeholder: 1.3 beta
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.7"
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or crash log
