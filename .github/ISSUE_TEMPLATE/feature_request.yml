name: Feature request
description: Suggest something FViewer should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could work
  - type: textarea
    id: reference
    attributes:
      label: Reference
      description: How VFXEditor or the game handles it, if you know.
